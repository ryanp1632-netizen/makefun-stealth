<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUSHWATER: a night-thief stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; object-fit: contain; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="HUSHWATER: sneak past lantern guards on the canal docks, take the ledger and reach the exit unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
